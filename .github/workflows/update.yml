name: Update app radar data
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/update.py
      - run: |
          git diff --quiet -- data.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: auto refresh data.json"
          git push
      - name: Check discovery sources
        run: |
          if [ -f .discovery_status.json ]; then
            echo "discovery status:"
            cat .discovery_status.json; echo
          else
            echo "no discovery status file"
            exit 0
          fi
          if grep -q '"all_failed": true' .discovery_status.json; then
            echo "::error::All discovery sources failed in this run."
            exit 1
          fi
          echo "Discovery sources OK."

